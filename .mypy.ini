[mypy]
explicit_package_bases = True
namespace_packages = True
exclude = (?x)^(backups/|tmp/|dev/|demo/|lib/yaml)
ignore_missing_imports = True
disable_error_code = valid-type, attr-defined, var-annotated, name-defined, assignment, misc, no-redef, type-arg, override, call-overload, has-type
no_strict_optional = True
ignore_errors = True

[mypy-lib.yaml.*]
ignore_errors = True

[mypy-CharMorphExpansion.lib.yaml.*]
ignore_errors = True
