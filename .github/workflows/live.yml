name: Live grid smoke test

# Starts a real OpenSimulator 0.9.3 on the runner (see tools/opensim/opensim.py) and logs in as a throwaway test avatar.
# Manual or weekly: it downloads OpenSim from GitHub releases. No secrets are used; the account exists only in that grid.
# Adapted from Kaleaon/React-Linkpoint's live.yml. Not yet run on GitHub Actions (it has been run in a Linux sandbox).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
    paths:
      - 'tools/opensim/**'
      - '.github/workflows/live.yml'

permissions:
  contents: read

jobs:
  opensim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Install libgdiplus (OpenSim's map tile renderer needs it)
        run: sudo apt-get update && sudo apt-get install -y libgdiplus
      - name: Cache the OpenSim download
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/charmorph-opensim
          key: opensim-0.9.3.0
      - run: python3 tools/opensim/opensim.py start
      - run: python3 tools/opensim/opensim.py login
      - name: Stop OpenSim and keep its log
        if: always()
        run: python3 tools/opensim/opensim.py stop || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: opensim-log
          path: /tmp/charmorph-opensim/opensim.log
          retention-days: 7
